name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AspireApp.slnx

      - name: Build
        run: dotnet build AspireApp.slnx --configuration Release --no-restore

      - name: Run tests (ApiService.Tests)
        run: dotnet test AspireApp.ApiService.Tests/AspireApp.ApiService.Tests.csproj --no-build -c Release --verbosity minimal

      - name: Run tests (solution)
        run: dotnet test AspireApp.slnx --no-build -c Release --verbosity minimal

  publish-placeholder:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - name: Publish placeholder
        run: echo "No publishing configured. Add registry/secrets to enable publishing."
