name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore AspireApp.slnx

    - name: Build
      run: dotnet build AspireApp.slnx --configuration Release --no-restore

    - name: Run tests
      run: |
        dotnet test AspireApp.ApiService.Tests/AspireApp.ApiService.Tests.csproj --no-build --verbosity normal

    - name: Publish API Docker image
      if: github.event_name == 'push'
      run: |
        echo "Skipping Docker build in CI by default. Configure registry and secrets to publish images."
